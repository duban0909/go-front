<div class="shell-layout">
  <header class="topbar">
    <div class="brand-wrap">
      <app-lucide-icon name="calendar-check" [size]="22" [strokeWidth]="2.2" class="brand-mark" />
      <p class="brand-name">Go <strong>Agenda</strong></p>
    </div>
  </header>

  <main class="content-panel">
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Navegacion principal">
    <a routerLink="./appointments" routerLinkActive="active">
      <app-lucide-icon name="calendar" [size]="22" [strokeWidth]="2" />
      <span>Citas</span>
    </a>
    <a routerLink="./services" routerLinkActive="active">
      <app-lucide-icon name="scissors" [size]="22" [strokeWidth]="2" />
      <span>Servicios</span>
    </a>
    <a routerLink="./hours" routerLinkActive="active">
      <app-lucide-icon name="clock" [size]="22" [strokeWidth]="2" />
      <span>Horario</span>
    </a>
    <a routerLink="./settings" routerLinkActive="active">
      <app-lucide-icon name="settings" [size]="22" [strokeWidth]="2" />
      <span>Ajustes</span>
    </a>
  </nav>
</div>
