<main class="onboarding-shell">
  <header class="onboarding-header">
    <p class="step-label">Paso {{ currentStep() }} de {{ stepCount }}</p>
    <div class="progress-track" role="progressbar" [attr.aria-valuenow]="currentStep()" aria-valuemin="1" [attr.aria-valuemax]="stepCount">
      <div class="progress-fill" [style.width.%]="progressPercent()"></div>
    </div>
  </header>

  <div class="step-body">
    @switch (currentStep()) {
      @case (1) {
        <app-onboarding-welcome (next)="goNext()" />
      }
      @case (2) {
        <app-onboarding-business-info [businessId]="businessId()" (next)="goNext()" (back)="goBack()" />
      }
      @case (3) {
        <app-onboarding-first-service [businessId]="businessId()" (next)="goNext()" (back)="goBack()" />
      }
      @case (4) {
        <app-onboarding-hours [businessId]="businessId()" (next)="goNext()" (back)="goBack()" />
      }
      @case (5) {
        <app-onboarding-employees [businessId]="businessId()" (next)="goNext()" (back)="goBack()" />
      }
      @case (6) {
        <app-onboarding-summary [businessId]="businessId()" (completed)="onOnboardingCompleted()" (back)="goBack()" />
      }
    }
  </div>
</main>
