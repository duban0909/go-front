<section class="page">
  <header class="page-header">
    <h1>Horario de Atencion</h1>
    <p>Configura tus dias y horas de atencion</p>
  </header>

  @if (error()) {
    <p class="error-banner" role="alert">{{ error() }}</p>
  }

  <article class="stat-card">
    <span class="stat-icon">
      <app-lucide-icon name="calendar-check" [size]="26" [strokeWidth]="1.9" />
    </span>
    <div>
      <p class="stat-label">Dias activos</p>
      <p class="stat-value">{{ activeDaysCount() }} de 7</p>
      <p class="stat-caption">Dias de atencion por semana</p>
    </div>
  </article>

  <article class="reminder-card">
    <div class="reminder-header">
      <span class="reminder-icon">
        <app-lucide-icon name="bell" [size]="22" [strokeWidth]="1.9" />
      </span>
      <h2>Recordatorio de citas</h2>
    </div>
    <p>Envia un recordatorio automatico por WhatsApp antes de cada cita.</p>

    <label class="reminder-select">
      Avisar
      <select
        [ngModel]="reminderHoursBefore()"
        (ngModelChange)="onReminderChange($event)"
      >
        @for (option of reminderOptions; track option) {
          <option [value]="option">{{ option }} horas</option>
        }
      </select>
      antes
    </label>
  </article>

  <h2 class="section-title">Dias de la semana</h2>

  <app-weekly-hours-editor
    [days]="days()"
    [isLoading]="isLoading()"
    (dayToggled)="toggleDay($event)"
    (dayTimesChanged)="onTimeChange($event)"
  />
</section>
