<section class="page">
  <header class="page-header">
    <h1>Ajustes</h1>
    <p>Informacion de tu negocio</p>
  </header>

  @if (error()) {
    <p class="error-banner" role="alert">{{ error() }}</p>
  }

  <article class="card">
    <h2>
      <span class="card-icon">
        <app-lucide-icon name="store" [size]="20" [strokeWidth]="1.9" />
      </span>
      Datos del negocio
    </h2>

    @if (isLoading()) {
      <p class="hint-text">Cargando...</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="saveChanges()" class="settings-form">
        <app-text-field label="Nombre del negocio" icon="user" [showLabel]="true" formControlName="name" />
        <app-text-field label="Telefono de WhatsApp" icon="phone" type="tel" [showLabel]="true" formControlName="phone_number" />

        @if (successMessage()) {
          <p class="success-text">{{ successMessage() }}</p>
        }

        <app-button type="submit" [loading]="isSaving()">
          {{ isSaving() ? 'Guardando...' : 'Guardar cambios' }}
        </app-button>
      </form>
    }
  </article>

  <button type="button" class="logout-card" (click)="logout()" [disabled]="isLoggingOut()">
    <app-lucide-icon name="log-out" [size]="20" [strokeWidth]="2" />
    {{ isLoggingOut() ? 'Cerrando sesion...' : 'Cerrar sesion' }}
  </button>

  <p class="version-tag">GoAgenda &middot; v0.1 (MVP)</p>
</section>
