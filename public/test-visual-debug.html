<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap');

:root {
	--go-teal: #03a580;
	--go-navy: #0e182c;
	--go-charcoal: #1d293d;
	--go-dark: #2a3144;
	--go-slate-200: #cdd9e4;
	--go-bg: #f1f5f9;

	--go-radius-sm: 0.75rem;
	--go-radius-md: 1rem;
	--go-radius-lg: 1.4rem;
}

* {
	box-sizing: border-box;
}

html,
body {
	min-height: 100%;
}

body {
	margin: 0;
	font-family: Manrope, 'Avenir Next', 'Segoe UI', sans-serif;
	color: var(--go-charcoal);
	background: var(--go-bg);
}

h1,
h2,
h3 {
	font-family: Sora, Manrope, sans-serif;
}

button,
input,
select,
textarea {
	font: inherit;
}

button {
	cursor: pointer;
}

@keyframes skeleton-pulse {
	0%,
	100% {
		opacity: 0.5;
	}

	50% {
		opacity: 1;
	}
}

.skeleton-block,
.skeleton-line {
	background: var(--go-slate-200);
	border-radius: 0.4rem;
	animation: skeleton-pulse 1.2s ease-in-out infinite;
}

.skeleton-line {
	height: 0.85rem;
}

.skeleton-card {
	pointer-events: none;
}

.home-switch {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.8rem 0.9rem;
  border-radius: var(--go-radius-md);
  background: color-mix(in srgb, var(--go-teal) 8%, white);
  cursor: pointer;
}

.home-switch-text {
  display: grid;
  gap: 0.15rem;
}

.home-switch-text small {
  color: #5b6472;
  font-size: 0.78rem;
  font-weight: 500;
}

.home-switch input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.home-switch-track {
  position: relative;
  flex: none;
  width: 2.8rem;
  height: 1.6rem;
  border-radius: 999px;
  background: var(--go-slate-200);
  transition: background-color 0.15s ease;
}

.home-switch-track::after {
  content: '';
  position: absolute;
  top: 0.2rem;
  left: 0.2rem;
  width: 1.2rem;
  height: 1.2rem;
  border-radius: 50%;
  background: #ffffff;
  transition: transform 0.15s ease;
}

.home-switch input:checked + .home-switch-track {
  background: var(--go-teal);
}

.home-switch input:checked + .home-switch-track::after {
  transform: translateX(1.2rem);
}

.home-switch input:focus-visible + .home-switch-track {
  outline: 2px solid var(--go-teal);
  outline-offset: 2px;
}

.home-switch.disabled {
	opacity: 0.5;
	pointer-events: none;
}
:host {
  display: block;
}

.page {
  display: grid;
  gap: 0;
  padding-bottom: 6.5rem;
}

.error-banner {
  margin: 1.1rem 1.1rem 0;
  border-radius: 0.9rem;
  border: 1px solid color-mix(in srgb, #bd2e2e 28%, white);
  background: color-mix(in srgb, #bd2e2e 8%, white);
  color: #7f2121;
  padding: 0.75rem 0.9rem;
  font-size: 0.88rem;
}

.agenda-filter {
  display: flex;
  gap: 0.5rem;
  overflow-x: auto;
  padding: 1.1rem 1.1rem 0;
  margin-bottom: 0.9rem;
  -webkit-overflow-scrolling: touch;
}

.agenda-chip {
  flex-shrink: 0;
  border: 1px solid color-mix(in srgb, var(--go-dark) 18%, white);
  border-radius: 999px;
  padding: 0.45rem 0.9rem;
  background: #fff;
  color: color-mix(in srgb, var(--go-dark) 65%, white);
  font-size: 0.85rem;
  font-weight: 600;
  white-space: nowrap;
}

.agenda-chip.active {
  border-color: var(--go-teal);
  background: var(--go-teal);
  color: #fff;
}

.appointment-employee {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  color: color-mix(in srgb, var(--go-dark) 55%, white);
  font-size: 0.82rem;
}

.calendar-card {
  background: #fff;
  border-radius: 0 0 var(--go-radius-lg) var(--go-radius-lg);
  padding: 1rem 0.8rem 1.2rem;
  box-shadow: 0 6px 18px rgb(16 32 64 / 6%);
}

.calendar-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0.4rem 0.9rem;
}

.calendar-nav h2 {
  margin: 0;
  color: var(--go-navy);
  font-size: 1.15rem;
}

.nav-btn-group {
  display: flex;
  gap: 0.4rem;
}

.nav-btn {
  width: 2.3rem;
  height: 2.3rem;
  border-radius: 0.7rem;
  border: 0;
  background: var(--go-bg);
  color: var(--go-dark);
  display: grid;
  place-items: center;
}

.week-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}

.day-cell {
  display: grid;
  justify-items: center;
  gap: 0.5rem;
  border: 0;
  background: transparent;
  padding: 0.3rem 0.1rem;
}

.weekday {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: color-mix(in srgb, var(--go-dark) 50%, white);
}

.day-number {
  display: grid;
  place-items: center;
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 50%;
  color: var(--go-navy);
  font-weight: 700;
}

.day-number.is-today {
  background: var(--go-teal);
  color: #fff;
}

.selected-dot {
  width: 0.35rem;
  height: 0.35rem;
  border-radius: 50%;
  background: var(--go-teal);
  margin-top: -0.35rem;
}

.selected-date-bar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin: 1.1rem 1.1rem 0.9rem;
}

.selected-date-icon {
  width: 2.1rem;
  height: 2.1rem;
  display: grid;
  place-items: center;
  border-radius: 0.6rem;
  background: color-mix(in srgb, var(--go-teal) 14%, white);
  color: var(--go-teal);
}

.selected-date-text {
  flex: 1;
  color: var(--go-navy);
  font-weight: 700;
  font-size: 0.98rem;
}

.today-pill {
  padding: 0.25rem 0.6rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--go-teal) 14%, white);
  color: var(--go-teal);
  font-size: 0.78rem;
  font-weight: 700;
}

.appointments-area {
  padding: 0 1.1rem;
  min-height: 14rem;
}

.empty-state {
  margin-top: 4.5rem;
  text-align: center;
  color: color-mix(in srgb, var(--go-dark) 55%, white);
  font-size: 0.95rem;
}

.appointment-list {
  display: grid;
  gap: 0.9rem;
}

.appointment-card {
  display: flex;
  gap: 0.8rem;
  background: #fff;
  border-radius: var(--go-radius-lg);
  border-left: 4px solid var(--go-teal);
  box-shadow: 0 4px 14px rgb(16 32 64 / 6%);
  padding: 1rem 1.1rem;
}

.appointment-card.status-pending,
.appointment-card.status-pending_payment {
  border-left-color: #d99a1f;
}

.appointment-card.highlighted {
  animation: appointment-highlight-pulse 2.2s ease-out;
}

@keyframes appointment-highlight-pulse {
  0%,
  35% {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--go-teal) 55%, white), 0 4px 14px rgb(16 32 64 / 6%);
    background: color-mix(in srgb, var(--go-teal) 10%, white);
  }

  100% {
    box-shadow: 0 4px 14px rgb(16 32 64 / 6%);
    background: #fff;
  }
}

.appointment-card.status-cancelled {
  border-left-color: color-mix(in srgb, var(--go-dark) 35%, white);
}

.appointment-card.status-completed {
  border-left-color: var(--go-navy);
}

/* Cita cuya hora ya paso: se atenua su CONTENIDO (icono + texto) para
   distinguirla de un vistazo de las que todavia estan por venir - la tarjeta
   en si sigue con fondo blanco solido (no opacity en el contenedor: eso
   mezclaba el blanco con el fondo de la pagina, que usa el mismo tono claro,
   y la tarjeta se volvia invisible). El borde izquierdo sigue indicando el
   estado real (confirmada, pago pendiente, cancelada, etc) a color completo.
   No aplica a .highlighted (recien creada/resaltada desde una notificacion),
   que siempre debe verse a maxima claridad. */
.appointment-card.past:not(.highlighted) > * {
  opacity: 0.55;
}

.past-badge {
  display: inline-flex;
  align-items: center;
  padding: 0.2rem 0.55rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--go-dark) 12%, white);
  color: color-mix(in srgb, var(--go-dark) 60%, white);
  font-size: 0.72rem;
  font-weight: 700;
  white-space: nowrap;
}

.appointment-icon {
  width: 2.6rem;
  height: 2.6rem;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: color-mix(in srgb, var(--go-teal) 14%, white);
  color: var(--go-teal);
}

.appointment-body {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 0.55rem;
}

.appointment-top {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 0.4rem 0.5rem;
}

.appointment-info {
  flex: 1 1 8rem;
  min-width: 0;
}

.appointment-top h3 {
  margin: 0;
  color: var(--go-navy);
  font-size: 1.02rem;
}

.appointment-service {
  margin: 0.1rem 0 0;
  color: color-mix(in srgb, var(--go-dark) 60%, white);
  font-size: 0.85rem;
}

.status-badge {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.25rem 0.55rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--go-teal) 14%, white);
  color: var(--go-teal);
  font-size: 0.75rem;
  font-weight: 700;
  white-space: nowrap;
}

.status-badge-pending,
.status-badge-pending_payment {
  background: color-mix(in srgb, #d99a1f 16%, white);
  color: #a06c0f;
}

.status-badge-cancelled {
  background: var(--go-bg);
  color: color-mix(in srgb, var(--go-dark) 55%, white);
}

.status-badge-completed {
  background: color-mix(in srgb, var(--go-navy) 12%, white);
  color: var(--go-navy);
}

.appointment-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.appointment-time {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  color: color-mix(in srgb, var(--go-dark) 62%, white);
  font-size: 0.9rem;
  font-weight: 600;
}

.appointment-price {
  color: var(--go-teal);
  font-weight: 800;
}

.appointment-phone {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  color: color-mix(in srgb, var(--go-dark) 60%, white);
  font-size: 0.85rem;
}

.fab {
  position: fixed;
  right: 1.1rem;
  bottom: calc(3.6rem + env(safe-area-inset-bottom) + 0.9rem);
  z-index: 15;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  border: 0;
  border-radius: 999px;
  padding: 0.85rem 1.3rem;
  background: var(--go-teal);
  color: #fff;
  font-weight: 700;
  box-shadow: 0 8px 20px rgb(3 165 128 / 35%);
}

.appointment-form {
  display: grid;
  gap: 0.9rem;
}

.form-date {
  margin: 0;
  color: color-mix(in srgb, var(--go-dark) 62%, white);
  font-size: 0.9rem;
  font-weight: 600;
}

.field-label {
  display: grid;
  gap: 0.35rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: color-mix(in srgb, var(--go-dark) 70%, white);
}

.service-select,
.time-input {
  min-height: 3.2rem;
  border-radius: 1rem;
  border: 1px solid var(--go-slate-200);
  background: #fff;
  padding: 0 0.9rem;
  font-size: 0.98rem;
  color: var(--go-charcoal);
}

.hint-text {
  margin: 0;
  color: color-mix(in srgb, var(--go-dark) 55%, white);
  font-size: 0.85rem;
}

.availability-results {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.availability-chip {
  border-radius: 999px;
  padding: 0.4rem 0.85rem;
  background: color-mix(in srgb, var(--go-teal) 14%, white);
  color: var(--go-teal);
  font-size: 0.85rem;
  font-weight: 700;
}

@media (min-width: 900px) {
  .fab {
    right: 2rem;
    bottom: 2rem;
  }
}

body { margin: 0; padding: 1.5rem; background: var(--go-bg); font-family: Manrope, sans-serif; }
</style>
</head>
<body>
  <div class="appointment-list" style="max-width: 500px;">
    <article class="appointment-card status-confirmed past">
      <span class="appointment-icon">🕐</span>
      <div class="appointment-body">
        <div class="appointment-top">
          <div class="appointment-info">
            <h3>Luisa</h3>
            <p class="appointment-service">Cejas</p>
          </div>
          <span class="status-badge status-badge-confirmed">Confirmada</span>
          <span class="past-badge">Ya pasó</span>
        </div>
        <span class="appointment-employee">👤 Francelly</span>
        <p>🕐 11:00 a. m.</p>
        <p>📞 573106777009</p>
      </div>
    </article>

    <article class="appointment-card status-confirmed" style="margin-top: 1rem;">
      <span class="appointment-icon">🕐</span>
      <div class="appointment-body">
        <div class="appointment-top">
          <div class="appointment-info">
            <h3>Cita futura (sin past)</h3>
            <p class="appointment-service">Corte</p>
          </div>
          <span class="status-badge status-badge-confirmed">Confirmada</span>
        </div>
      </div>
    </article>
  </div>
</body>
</html>
